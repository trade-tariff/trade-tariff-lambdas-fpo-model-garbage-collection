---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-docker
        args:
          - "--ignore"
          - terraform
          - "--fix"

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.15.0
    hooks:
      - id: golangci-lint-full
        entry: "bash -c 'cd collector && golangci-lint run ./...'"

  - repo: https://github.com/rhysd/actionlint.git
    rev: v1.7.12
    hooks:
      - id: actionlint-docker

  - repo: local
    hooks:
      - id: briar
        name: Briar (offline secret scan)
        language: docker_image
        # Keep the image version and digest aligned with flake.nix.
        entry: ghcr.io/willfish/briar:v0.1.0@sha256:8e36caa3ef5892e45435d5388632d63f25e50224cee01678b82503eecc7cf728
        args: ["--"]
        types: [file]
        require_serial: true
        stages: ["pre-commit", "pre-push"]
